{% extends "base.html" %}
{% load static %}
{% block title %}Password Changed - Placify{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/index.css' %}">{% endblock %}
{% block content %}
    <section class="section login-section">
        <div class="background-slideshow">
            <div class="slide" style="background-image: url('{% static 'images/college-bg.jpeg' %}'); opacity: 1;"></div>
            <div class="slide-overlay"></div>
        </div>
        <div class="login-container">
            <img src="{% static 'images/logo.png' %}" alt="Placify Logo" class="logo"
                 onerror="this.src='https://via.placeholder.com/150?text=Placify';">
            <h1>Password changed</h1>
            <p class="subtitle">Your password has been updated. You can sign in now.</p>
            <div class="extra-links">
                <p>Back to <a href="{% url 'placements:index' %}">Sign in</a></p>
            </div>
        </div>
    </section>
{% endblock %}
